name: Poll runs

# Never runs on pull requests: secrets must not be reachable from forks.
on:
  schedule:
    - cron: "7 */2 * * *" # every 2 hours
  workflow_dispatch:

concurrency:
  group: poll-runs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Claude Code CLI runs coaching on a Claude plan (default backend). Pinned for reproducibility.
      - if: vars.COACH_BACKEND != 'gemini'
        run: npm install -g @anthropic-ai/claude-code@2.1.283
      - run: npm run coach -- poll
        env:
          ATHLETE_TZ: America/Los_Angeles
          # Coaching backend: repo variable COACH_BACKEND = cli (default) or gemini; COACH_MODEL optional.
          COACH_BACKEND: ${{ vars.COACH_BACKEND }}
          COACH_MODEL: ${{ vars.COACH_MODEL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          ATHLETE_5K_TIME: ${{ secrets.ATHLETE_5K_TIME }}
          DISCORD_WEBHOOK_RUN_LOG: ${{ secrets.DISCORD_WEBHOOK_RUN_LOG }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
